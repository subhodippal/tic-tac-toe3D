<!doctype html>
<html lang="en" data-theme="neon">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tic Tac Toe 3D</title>
  <meta name="description" content="Neon 3D tic tac toe for mobile and desktop. 3×3 to 10×10 boards, 2–4 players, play the computer, pass & play, or online with friends.">
  <meta name="theme-color" content="#05020f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="XO 3D">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preload" href="./fonts/orbitron-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <canvas id="c" aria-label="Tic tac toe board"></canvas>
  <div id="bg" aria-hidden="true"><canvas id="bgfx"></canvas><i class="beams"></i><i class="flash"></i><i class="scan"></i></div>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div class="topbar">
      <button id="btnPause" class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div id="roomTag" class="room-tag hidden"></div>
      <div class="topbar-right">
        <button id="btnEmoji" class="icon-btn hidden" aria-label="Send emoji">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>
        </button>
        <button id="btnView" class="icon-btn" aria-label="Switch camera view" title="Switch view (V)">
          <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
        </button>
        <button id="btnSound" class="icon-btn" aria-label="Toggle sound">
          <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>
      </div>
    </div>
    <div id="score" class="score"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="emojiPanel" class="emoji-panel hidden"></div>
    <div id="fx"></div>
    <div id="banner" class="banner hidden"><b></b><small></small></div>
    <div class="bottombar">
      <div id="status" class="status"></div>
      <button id="btnNext" class="btn btn-primary next hidden">Next round</button>
    </div>
  </div>

  <!-- Menu -->
  <section id="scrMenu" class="screen">
    <div class="card menu-card">
      <h1 class="logo" aria-label="Tic Tac Toe 3D">
        <span class="w1">TIC</span><span class="w2">TAC</span><span class="w3">TOE</span><small>3D</small>
      </h1>
      <p class="tagline">3×3 to 10×10 · up to 4 players</p>
      <div class="theme-row">
        <span class="theme-label">Theme</span>
        <button id="themeToggle" class="theme-toggle" type="button" role="switch" aria-label="Theme: Paper &amp; Pen or Neon" data-on="neon">
          <i class="knob" aria-hidden="true"></i>
          <span data-v="paper">✎ Paper &amp; Pen</span><span data-v="neon">✦ Neon</span>
        </button>
      </div>
      <button id="btnContinue" class="btn btn-ghost hidden">Continue game</button>
      <button id="btnVsCpu" class="btn btn-cyan">
        <svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg>
        Play vs Computer
      </button>
      <button id="btnLocal" class="btn btn-pink">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M12 20c0-3.3 1.8-6 4-6s6 2.7 6 6"/></svg>
        Pass &amp; Play
      </button>
      <button id="btnOnline" class="btn btn-lime">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
        Play Online
      </button>
      <div class="row">
        <button id="btnHelp" class="btn btn-ghost small">How to play</button>
        <button id="btnSettings" class="btn btn-ghost small">Settings</button>
      </div>
      <button id="btnInstall" class="btn btn-ghost small hidden">⬇ Install app</button>
    </div>
  </section>

  <!-- Game setup (local and online host) -->
  <section id="scrSetup" class="screen hidden">
    <div class="card">
      <h2 id="setupTitle">New game</h2>
      <div class="optlbl">Board</div>
      <div class="picker sizes" id="pickBoard"></div>
      <div class="optlbl">Win rule <button class="howto" id="btnHow" type="button">how to win?</button></div>
      <div class="picker three" id="pickRule"></div>
      <div class="optlbl">Players <small id="playersNote"></small></div>
      <div class="seg" id="pickPlayers"><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button></div>
      <div id="seatRows" class="seat-rows"></div>
      <div id="levelBox">
        <div class="optlbl">Computer skill</div>
        <div class="seg" id="segLevel"><button data-v="easy">Easy</button><button data-v="normal">Normal</button><button data-v="hard">Hard</button></div>
      </div>
      <p id="setupErr" class="err"></p>
      <button id="btnStart" class="btn btn-primary">Start game</button>
      <button class="btn btn-ghost small" data-back>Back</button>
    </div>
  </section>

  <!-- Online -->
  <section id="scrOnline" class="screen hidden">
    <div class="card">
      <h2>Play online</h2>
      <label class="field"><span>Your name</span><input id="inpName" maxlength="12" autocomplete="nickname" placeholder="Player"></label>
      <button id="btnCreate" class="btn btn-primary">Create a room</button>
      <div class="divider"><span>or join a friend</span></div>
      <div class="join-row">
        <input id="inpCode" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <button id="btnJoin" class="btn btn-lime">Join</button>
      </div>
      <p id="onlineMsg" class="err"></p>
      <button class="btn btn-ghost small" data-back>Back</button>
    </div>
  </section>

  <!-- Lobby -->
  <section id="scrLobby" class="screen hidden">
    <div class="card">
      <h2>Room</h2>
      <div class="code-box"><span id="lobbyCode">-----</span></div>
      <div class="row">
        <button id="btnCopy" class="btn btn-ghost small">Copy code</button>
        <button id="btnShare" class="btn btn-ghost small">Share link</button>
      </div>
      <p class="muted center" id="lobbyRule"></p>
      <div id="lobbySeats" class="seat-rows"></div>
      <p class="muted center" id="lobbyNote"></p>
      <p id="lobbyMsg" class="err"></p>
      <button id="btnLobbyStart" class="btn btn-primary">Start game</button>
      <button id="btnLobbyLeave" class="btn btn-ghost small">Leave</button>
    </div>
  </section>

  <!-- Pause -->
  <section id="scrPause" class="screen hidden">
    <div class="card">
      <h2>Paused</h2>
      <p class="muted center" id="pauseRule"></p>
      <button id="btnResume" class="btn btn-primary">Resume</button>
      <button id="btnRestart" class="btn btn-ghost">Restart match</button>
      <button id="btnPauseHelp" class="btn btn-ghost">How to win</button>
      <button id="btnPauseSettings" class="btn btn-ghost">Settings</button>
      <button id="btnQuit" class="btn btn-ghost danger">Quit to menu</button>
    </div>
  </section>

  <!-- Settings -->
  <section id="scrSettings" class="screen hidden">
    <div class="card">
      <h2>Settings</h2>
      <label class="toggle"><span>Sound</span><input type="checkbox" id="setSound"><i></i></label>
      <label class="toggle"><span>Vibration</span><input type="checkbox" id="setVibrate"><i></i></label>
      <div class="optlbl">Theme</div>
      <div class="seg" data-theme-pick><button data-v="paper">✎ Paper &amp; Pen</button><button data-v="neon">✦ Neon</button></div>
      <div class="optlbl">Neon glow</div>
      <div class="seg" id="segQuality"><button data-v="high">Bloom</button><button data-v="low">Battery saver</button></div>
      <div class="optlbl">Camera</div>
      <div class="seg" id="segView"><button data-v="tilt">3D tilt</button><button data-v="top">Top down</button></div>
      <button id="btnSettingsClose" class="btn btn-primary">Done</button>
    </div>
  </section>

  <!-- Help -->
  <section id="scrHelp" class="screen hidden">
    <div class="card">
      <h2 id="helpTitle">How to play</h2>
      <div id="helpBody" class="help"></div>
      <button id="btnHelpClose" class="btn btn-primary">Got it</button>
    </div>
  </section>

  <!-- Message dialog -->
  <section id="scrMsg" class="screen hidden">
    <div class="card">
      <h2 id="msgTitle"></h2>
      <p class="muted center" id="msgText"></p>
      <button id="btnMsgOk" class="btn btn-primary">OK</button>
    </div>
  </section>

  <noscript><p class="noscript">This game needs JavaScript.</p></noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
